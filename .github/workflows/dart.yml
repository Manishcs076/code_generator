name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      - name: Flutter pub get
        run: |
          cd app
          flutter pub get

      - name: Analyze project
        run: |
          cd app
          flutter analyze

      - name: Run tests
        run: |
          cd app
          flutter test
