name: Build & Release (Android + iOS + TestFlight)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v3

      # Setup Java (for Android)
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Setup Flutter (correct version)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          architecture: arm64

      # Install Flutter dependencies
      - name: Install Dependencies
        run: flutter pub get

      # --------------------------
      # Auto Semantic Versioning
      # --------------------------
      - name: Auto Semantic Versioning
        id: version
        run: |
          # Read current version from pubspec.yaml
          CURRENT_VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT_VERSION | cut -d'+' -f2)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"

          echo "Current version: $MAJOR.$MINOR.$PATCH+$BUILD_NUMBER"
          echo "Branch: $GITHUB_REF"

          # Determine version bump
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            # Major bump
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            # Minor bump
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            # Patch bump
            PATCH=$((PATCH + 1))
          fi

          # Increment build number
          BUILD_NUMBER=$((BUILD_NUMBER + 1))

          NEW_VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION_NAME+$BUILD_NUMBER"

          # Update pubspec.yaml
          sed -i '' "s/version: .*/version: $NEW_VERSION_NAME+$BUILD_NUMBER/" pubspec.yaml

          # Export environment variables
          echo "VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      # --------------------------
      # Build Android
      # --------------------------
      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Build Android AAB
        run: flutter build appbundle --release

      # --------------------------
      # Build iOS IPA (no codesign)
      # --------------------------
      - name: Build iOS IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r app.ipa Payload

      # --------------------------
      # Clean unnecessary directories before GitHub Release
      # --------------------------
      - name: Clean Flutter Release Artifacts
        run: |
          rm -rf build/app/outputs/apk/release/baselineProfiles
          rm -rf build/app/outputs/apk/release/merged*

      # --------------------------
      # Upload ALL builds to GitHub Releases
      # --------------------------
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: >
            build/app/outputs/apk/release/*.apk,
            build/app/outputs/bundle/release/*.aab,
            build/ios/iphoneos/app.ipa
          tag: v$VERSION_NAME+$BUILD_NUMBER
          token: ${{ secrets.TOKEN }}
